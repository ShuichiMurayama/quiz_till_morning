<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<meta name="robots" content="noindex, nofollow">
<title>朝までそれ正解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>
/* =====================================================================
   Firebase の設定（SETUP.md 参照）
   apiKey が空のままだと「デモモード」（同じブラウザのタブ同士でのみ同期）で動きます。
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  databaseURL: "",
  projectId: "",
  appId: ""
};
</script>
<style>
:root{
  --bg1:#0b1026; --bg2:#18205a; --dawn:#ff9b6a;
  --ink:#f6f2e8; --muted:#a3abd2; --line:rgba(255,255,255,.14); --glass:rgba(255,255,255,.07);
  --gold:#ffc93c; --gold2:#ffb000; --red:#e8263f; --ok:#3ddc97;
  --paper:#fffaf0; --paper-ink:#1d1b26;
  --r:16px;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-title:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-hand:"Yusei Magic","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--f-ui);color:var(--ink);background:var(--bg1);
  background:
    radial-gradient(120% 60% at 50% 120%, rgba(255,155,106,.35), transparent 60%),
    radial-gradient(80% 50% at 85% -10%, rgba(120,140,255,.25), transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  -webkit-font-smoothing:antialiased;
}
body::before{ /* stars */
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:
    radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 72% 9%,#fff,transparent),
    radial-gradient(1.4px 1.4px at 38% 32%,#fff,transparent),radial-gradient(1px 1px at 88% 40%,#fff,transparent),
    radial-gradient(1px 1px at 22% 55%,#fff,transparent),radial-gradient(1.2px 1.2px at 60% 22%,#fff,transparent),
    radial-gradient(1px 1px at 5% 80%,#fff,transparent),radial-gradient(1px 1px at 95% 70%,#fff,transparent);
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
[hidden]{display:none!important}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:14px;
  background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:15px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1a00;border:0;box-shadow:0 4px 0 #b37400,0 8px 20px rgba(255,180,0,.25)}
.btn.gold:active{transform:translateY(3px);box-shadow:0 1px 0 #b37400}
.btn.red{background:linear-gradient(180deg,#ff4d63,var(--red));color:#fff;border:0;box-shadow:0 4px 0 #9b1024}
.btn.big{min-height:58px;font-size:19px;font-weight:900;letter-spacing:.04em}
.btn.small{min-height:36px;font-size:13px;padding:0 12px;border-radius:11px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.38;pointer-events:none}
.row{display:flex;gap:8px}.row>*{flex:1}
input.tx,textarea.tx{width:100%;background:rgba(0,0,0,.25);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px;outline:none}
input.tx:focus,textarea.tx:focus{border-color:var(--gold)}
textarea.tx{resize:none}
label.lb{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;gap:8px;flex:none}
.hdr .room{font-size:12px;color:var(--muted);letter-spacing:.08em}
.hdr .room b{font-family:var(--f-title);font-weight:400;color:var(--gold);font-size:17px;letter-spacing:.12em;margin-left:2px}
.hdr .rnd{flex:1;text-align:center;font-family:var(--f-title);font-size:15px}
.hdr .icons{display:flex;gap:4px}
.icon{height:36px;min-width:36px;padding:0 8px;border-radius:11px;background:var(--glass);border:1px solid var(--line);font-size:15px;display:flex;align-items:center;gap:3px}
.icon small{font-size:12px;font-weight:700}
.demo{font-size:10px;font-weight:900;background:#7b5cff;color:#fff;border-radius:6px;padding:2px 5px;margin-left:4px}
.mebar{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);flex:none;margin-top:-4px}
.mebar b{color:var(--ink)}
.tag{display:inline-block;font-size:10px;font-weight:900;padding:2px 6px;border-radius:6px;background:var(--gold);color:#2a1a00;margin-left:4px;vertical-align:1px}

/* ---------- home ---------- */
.logo{text-align:center;margin:auto 0 8px}
.logo .pre{font-family:var(--f-title);color:var(--gold);font-size:18px;letter-spacing:.2em}
.logo h1{font-family:var(--f-title);font-weight:400;font-size:clamp(44px,14vw,64px);line-height:1.02;margin:6px 0 10px;
  background:linear-gradient(180deg,#fff 30%,#ffd98a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.logo h1 em{font-style:normal;display:block;font-size:.62em;background:linear-gradient(180deg,var(--gold),#ff7a3d);-webkit-background-clip:text;background-clip:text}
.logo p{margin:0;color:var(--muted);font-size:13px}
.panel{background:rgba(10,14,40,.55);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:auto;backdrop-filter:blur(6px)}
.or{text-align:center;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.code-in{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-family:var(--f-title)}
.note{font-size:12px;color:var(--muted);line-height:1.6;text-align:center}
.note.demo-note{background:rgba(123,92,255,.15);border:1px dashed rgba(123,92,255,.6);border-radius:12px;padding:8px 10px;text-align:left}

/* ---------- cards ---------- */
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.odai{background:linear-gradient(180deg,#232c78,#1a2160);border:1.5px solid rgba(255,201,60,.45);border-radius:18px;padding:14px 16px;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.odai .q{font-family:var(--f-title);font-size:12px;color:var(--gold);letter-spacing:.15em}
.odai .t{font-weight:900;font-size:clamp(19px,5.6vw,25px);line-height:1.35;margin-top:4px;word-break:break-word}
.odai.mini{padding:8px 12px;border-radius:14px}
.odai.mini .t{font-size:15px;margin-top:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.letter{display:inline-flex;align-items:center;justify-content:center;flex:none;width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff5b70,var(--red));color:#fff;font-family:var(--f-title);font-size:34px;line-height:1;
  box-shadow:0 4px 0 #8e0f22,0 6px 16px rgba(232,38,63,.4);border:2px solid #fff}
.letter.none{background:rgba(255,255,255,.12);font-size:13px;font-family:var(--f-ui);font-weight:900;border-color:var(--line);box-shadow:none}
.letter.sm{width:30px;height:30px;font-size:17px;border-width:1.5px;box-shadow:0 2px 0 #8e0f22}
.lt-row{display:flex;align-items:center;gap:10px}
.lt-row .de{font-weight:900;font-size:17px}
.odai .lt-row+.t{margin-top:8px}
.odai.mini{display:flex;align-items:center;gap:8px}
.odai.mini .de{font-size:13px;font-weight:900;flex:none}
.odai.mini .t{flex:1;min-width:0}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kgrid button{height:44px;border-radius:10px;background:var(--glass);border:1px solid var(--line);font-family:var(--f-title);font-size:20px}
.kgrid button.on{background:var(--red);border-color:var(--red)}
.kgrid button.blank{visibility:hidden}
.warn{font-size:12px;font-weight:700;color:#ffb35c;text-align:center}
.cat{display:inline-block;font-size:11px;font-weight:700;color:var(--gold);border:1px solid rgba(255,201,60,.5);border-radius:99px;padding:1px 8px}

/* ---------- lobby ---------- */
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg1)}
.pick{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.pick .odai{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.pick textarea{flex:1;min-height:90px}
.set{display:flex;flex-direction:column;gap:6px;flex:none}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}
.chips{display:flex;gap:4px}
.dur-in{display:flex;align-items:center;gap:6px}
.dur-in input{width:84px;height:38px;border-radius:10px;background:rgba(0,0,0,.25);border:1.5px solid var(--line);text-align:right;padding:0 10px;font-family:var(--f-title);font-size:20px;outline:none}
.dur-in input:focus{border-color:var(--gold)}
.chips button{height:32px;min-width:46px;padding:0 8px;border-radius:9px;background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:13px}
.chips button.on{background:var(--gold);color:#2a1a00;border-color:var(--gold)}
.tgl{width:50px;height:30px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;transition:background .2s;flex:none}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl.on{background:var(--ok)}.tgl.on::after{transform:translateX(20px)}
.pstrip{display:flex;align-items:center;gap:8px;flex:none;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:8px 10px;min-height:48px}
.pstrip .cnt{font-family:var(--f-title);font-size:20px;color:var(--gold);flex:none}
.pstrip .cnt small{font-family:var(--f-ui);font-size:11px;color:var(--muted);font-weight:700;margin-left:2px}
.pstrip .names{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wait{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.wait .moon{font-size:58px;animation:float 3s ease-in-out infinite}
.wait h2{font-family:var(--f-title);font-weight:400;font-size:22px;margin:4px 0 0}
.wait p{margin:0;color:var(--muted);font-size:13px}
@keyframes float{50%{transform:translateY(-8px)}}
.last{font-size:12px;color:var(--muted);text-align:center}
.last b{color:var(--gold);font-family:var(--f-hand);font-size:16px;font-weight:400}

/* ---------- timer ---------- */
.timer{display:flex;align-items:center;gap:10px;flex:none}
.timer .bar{flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.timer .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--gold));border-radius:99px;transform-origin:left;transition:transform .25s linear}
.timer .sec{font-family:var(--f-title);font-size:30px;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.timer.hurry .bar i{background:var(--red)}
.timer.hurry .sec{color:#ff5a70;animation:pulse .5s ease-in-out infinite alternate}
.timer.over .sec{color:var(--muted);font-size:16px}
@keyframes pulse{to{transform:scale(1.12)}}

/* ---------- answering ---------- */
.ans{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.ans textarea{flex:1;min-height:80px;max-height:160px;font-family:var(--f-hand);font-size:24px;background:var(--paper);color:var(--paper-ink);border:0;border-radius:14px;padding:14px;outline:3px solid transparent}
.ans textarea:focus{outline-color:var(--gold)}
.hint{font-size:11px;color:var(--muted);text-align:center}
.done{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.done .ok{font-weight:900;color:var(--ok);font-size:15px}
.progress{flex:none;display:flex;flex-direction:column;gap:6px}
.progress .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700}
.progress .lbl b{color:var(--ink);font-size:14px}
.dots{display:flex;flex-wrap:wrap;gap:4px;max-height:52px;overflow:hidden}
.dots span{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--muted);white-space:nowrap}
.dots span.y{background:rgba(61,220,151,.18);color:var(--ok)}
.hostbar{flex:none;display:flex;gap:8px}
.hostbar>*{flex:1}

/* ---------- flips (answer boards) ---------- */
.flip{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:6px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:0;min-height:0;overflow:hidden;
  box-shadow:0 3px 0 #c9bfa6,0 6px 14px rgba(0,0,0,.25);border:2px solid transparent;transition:transform .15s,border-color .15s}
.flip .ft{font-family:var(--f-hand);font-size:var(--fs,22px);line-height:1.15;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.flip .fc{position:absolute;top:4px;right:5px;background:var(--red);color:#fff;font-weight:900;font-size:12px;border-radius:99px;padding:1px 7px;min-width:24px}
.flip .fn{font-size:10px;color:#6b6475;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.board.compact .flip .fn{display:none}
.flip.mine{outline:3px solid var(--ok);outline-offset:-2px}
.flip.sel{border-color:var(--red);transform:scale(1.03);box-shadow:0 0 0 4px rgba(232,38,63,.35),0 6px 14px rgba(0,0,0,.25)}
.flip.new{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.flip.bump .fc{animation:bump .5s}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}}
@keyframes bump{40%{transform:scale(1.6)}}
.board{flex:1;min-height:0;display:grid;gap:8px;align-content:center}
.board-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center;border:2px dashed var(--line);border-radius:16px}
.bstat{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:700;flex:none}
.bstat b{color:var(--ink);font-size:15px}
.dock{flex:none;display:flex;flex-direction:column;gap:8px;background:rgba(6,9,30,.6);border:1px solid var(--line);border-radius:18px;padding:10px}
.dock .mine-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dock .mine-line .flip{flex:1;padding:6px 10px}
.dock .mine-line .flip .ft{font-size:20px}
.dock .msg{font-size:13px;text-align:center;color:var(--muted);line-height:1.5}
.dock .msg b{color:var(--ink)}
.nom{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.nom::-webkit-scrollbar{display:none}
.nom button{flex:none;height:34px;padding:0 12px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:13px;font-weight:700}
.nom button.req{border-color:var(--gold);color:var(--gold);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
.thinking{display:inline-flex;gap:4px;margin-left:4px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:dot 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-5px);opacity:.4}}

/* ---------- result ---------- */
.res{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.drum{font-family:var(--f-title);font-size:34px;display:flex;flex-direction:column;align-items:center;gap:14px}
.drum .ds{display:flex;gap:14px}
.drum .ds i{width:16px;height:16px;border-radius:50%;background:var(--gold);animation:dot .5s infinite}
.drum .ds i:nth-child(2){animation-delay:.1s}.drum .ds i:nth-child(3){animation-delay:.2s}
.drum.shake{animation:shake .12s infinite}
@keyframes shake{25%{transform:translate(2px,-1px)}75%{transform:translate(-2px,1px)}}
.win-flip{overflow:visible;width:100%;min-height:150px;padding:22px 16px;border-radius:18px;--fs:clamp(30px,10vw,46px);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.win-flip .ft{-webkit-line-clamp:3}
.stamp{position:absolute;right:-8px;top:-22px;width:80px;height:80px;border-radius:50%;border:6px solid var(--red);color:var(--red);
  font-family:var(--f-title);font-size:24px;display:flex;align-items:center;justify-content:center;transform:rotate(-14deg);opacity:.9;
  animation:stamp .45s .35s cubic-bezier(.3,1.8,.5,1) both;background:rgba(255,255,255,.4)}
@keyframes stamp{from{transform:rotate(-14deg) scale(3);opacity:0}}
.winners{font-size:14px;color:var(--muted);line-height:1.6}
.winners b{color:var(--ink)}
.pt{display:inline-block;background:var(--gold);color:#2a1a00;font-weight:900;border-radius:8px;padding:1px 8px;margin-left:4px}
.myres{font-family:var(--f-title);font-size:26px}
.myres.yes{color:var(--gold);animation:pulse .6s ease-in-out infinite alternate}
.myres.no{color:var(--muted);font-size:18px}
.none-x{font-family:var(--f-title);font-size:40px;color:var(--muted)}
.minirank{width:100%;display:flex;flex-direction:column;gap:4px}
.rk{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:700}
.rk .n{font-family:var(--f-title);width:26px;color:var(--gold)}
.rk .nm{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .sc{font-family:var(--f-title);font-size:17px}
.rk.me{border-color:var(--ok)}
.fade-in{animation:fadein .5s both}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}}

/* ---------- final ---------- */
.podium{--ph:clamp(100px,24dvh,190px);display:flex;align-items:flex-end;justify-content:center;gap:8px;width:100%;margin-top:auto}
.pod{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;opacity:0;transform:translateY(30px);transition:all .6s cubic-bezier(.2,1.4,.4,1)}
.pod.show{opacity:1;transform:none}
.pod .who{font-weight:900;font-size:14px;max-width:100%;line-height:1.3;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pod .sc{font-size:12px;color:var(--muted)}
.pod .col{width:100%;border-radius:12px 12px 4px 4px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-family:var(--f-title);font-size:26px;color:#2a1a00}
.pod.p1 .col{height:var(--ph);background:linear-gradient(180deg,#ffe27a,#ffb000)}
.pod.p2 .col{height:calc(var(--ph)*.72);background:linear-gradient(180deg,#eef1ff,#a9b2d6)}
.pod.p3 .col{height:calc(var(--ph)*.52);background:linear-gradient(180deg,#ffc79b,#c97a3c)}
.pod .crown{font-size:30px}
.final-h{font-family:var(--f-title);font-size:26px;color:var(--gold)}

/* ---------- overlays ---------- */
.ovl{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,5,20,.72);backdrop-filter:blur(4px);animation:fadein .2s}
.modal{width:100%;max-width:420px;max-height:88dvh;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,#1f276c,#141a4d);border:1px solid var(--line);border-radius:22px;padding:18px}
.modal h3{margin:0;font-family:var(--f-title);font-weight:400;font-size:20px;text-align:center}

<script>
"use strict";
/* =====================================================================
   Utilities
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const genCode = () => Array.from({ length: 4 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
const MAX_ANS = 30, MAX_NAME = 10;
const DEFAULT_LETTERS = "あいうえおかきくけこさしすせそたちつてとなにねのはひふへほまみむめもやゆよらりれろわ";
const GOJUON = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもや　ゆ　よらりるれろわ　　　を";

function loadScript(src) {
  return new Promise((ok, ng) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => ng(new Error("load " + src)); document.head.appendChild(s); });
}

/* =====================================================================
   Transport layer — Firebase Realtime Database or local demo
   Interface: uid, mode, on(path,cb)->unsub, get(path), set(path,v), update(path,obj), now(), presence(path)
   ===================================================================== */
async function FirebaseDB(cfg) {
  const V = "10.12.2";
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-database-compat.js`);
  firebase.initializeApp(cfg);
  const auth = firebase.auth();
  const user = await new Promise((ok, ng) => {
    const off = auth.onAuthStateChanged(u => { off(); if (u) ok(u); else auth.signInAnonymously().then(c => ok(c.user), ng); });
  });
  const db = firebase.database();
  let offset = 0;
  db.ref(".info/serverTimeOffset").on("value", s => { offset = s.val() || 0; });
  return {
    mode: "firebase", uid: user.uid,
    on(path, cb) { const r = db.ref(path); const h = s => cb(s.val()); r.on("value", h, e => console.warn("listen", path, e)); return () => r.off("value", h); },
    async get(path) { return (await db.ref(path).get()).val(); },
    set(path, v) { return db.ref(path).set(v); },
    update(path, o) { return db.ref(path).update(o); },
    now() { return Date.now() + offset; },
    onConnection(cb) { db.ref(".info/connected").on("value", s => cb(!!s.val())); },
    presence(path) {
      db.ref(".info/connected").on("value", s => {
        if (!s.val()) return;
        const r = db.ref(path); r.onDisconnect().set(false); r.set(true);
      });
    }
  };
}

function LocalDB() {
  const KEY = "asamade-demo-db";
  const ch = ("BroadcastChannel" in window) ? new BroadcastChannel("asamade-demo") : null;
  let uid = sessionStorage.getItem("asamade-demo-uid");
  if (!uid) { uid = "u" + Math.random().toString(36).slice(2, 10); sessionStorage.setItem("asamade-demo-uid", uid); }
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const keys = p => p.split("/").filter(Boolean);
  const getAt = (o, p) => keys(p).reduce((x, k) => (x == null ? undefined : x[k]), o);
  function setAt(o, p, v) {
    const ks = keys(p); let x = o;
    for (let i = 0; i < ks.length - 1; i++) { if (typeof x[ks[i]] !== "object" || x[ks[i]] === null) x[ks[i]] = {}; x = x[ks[i]]; }
    if (v === null || v === undefined) delete x[ks[ks.length - 1]]; else x[ks[ks.length - 1]] = clone(v);
  }
  const listeners = new Set();
  function notify() {
    const d = load();
    for (const l of listeners) {
      const v = getAt(d, l.path); const j = JSON.stringify(v ?? null);
      if (j !== l.last) { l.last = j; l.cb(v == null ? null : clone(v)); }
    }
  }
  function save(d) { localStorage.setItem(KEY, JSON.stringify(d)); ch && ch.postMessage(1); notify(); }
  if (ch) ch.onmessage = notify;
  window.addEventListener("storage", e => { if (e.key === KEY) notify(); });
  return {
    mode: "demo", uid,
    on(path, cb) { const l = { path, cb, last: undefined }; listeners.add(l); setTimeout(notify, 0); return () => listeners.delete(l); },
    async get(path) { const v = getAt(load(), path); return v == null ? null : clone(v); },
    async set(path, v) { const d = load(); setAt(d, path, v); save(d); },
    async update(path, o) { const d = load(); for (const k in o) setAt(d, path + "/" + k, o[k]); save(d); },
    now() { return Date.now(); },
    onConnection(cb) { setTimeout(() => cb(true), 0); },
    presence(path) {
      const d = load(); setAt(d, path, true); save(d);
      window.addEventListener("pagehide", () => { const d2 = load(); if (getAt(d2, path) !== undefined) { setAt(d2, path, false); save(d2); } });
    }
  };
}

/* =====================================================================
   Sound
   ===================================================================== */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { } } if (AC && AC.state === "suspended") AC.resume(); return AC; }
function tone(f, dur, type = "sine", vol = .15, when = 0) {
  if (!S.sound) return; const a = ac(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
const SFX = {
  tick: () => tone(1000, .05, "square", .05),
  pop: () => { tone(520, .09, "triangle", .16); tone(800, .14, "triangle", .14, .07); },
  same: () => { tone(700, .08, "triangle", .14); tone(940, .1, "triangle", .12, .06); },
  start: () => [392, 523, 659].forEach((f, i) => tone(f, .18, "triangle", .14, i * .1)),
  drum: () => { for (let i = 0; i < 38; i++) tone(70 + Math.random() * 40, .05, "triangle", .06 + i * .004, i * .065); },
  ding: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .45, "triangle", .14, i * .08)); },
  buzz: () => tone(140, .45, "sawtooth", .08),
};
document.addEventListener("pointerdown", () => ac(), { once: true });

/* =====================================================================
   Confetti
   ===================================================================== */
function confetti(n = 160) {
  const cv = $("#confetti"), cx = cv.getContext("2d"); const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ["#ffc93c", "#e8263f", "#3ddc97", "#7b8cff", "#ffffff", "#ff9b6a"];
  const ps = Array.from({ length: n }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4, a: Math.random() * 6, va: (Math.random() - .5) * .4, c: cols[Math.random() * cols.length | 0] }));
  const t0 = performance.now();
  (function fr(t) {
    cx.clearRect(0, 0, W, H);
    for (const p of ps) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore(); }
    if (t - t0 < 3500) requestAnimationFrame(fr); else cx.clearRect(0, 0, W, H);
  })(t0);
}

/* =====================================================================

   ===================================================================== */
const S = {

  sound: localStorage.getItem("asamade-sound") !== "0",

  seen: { round: null, keys: new Set(), counts: {} },
  lastTick: null, allSubSince: null, advancing: false, autoRevealing: false,
  online: true, everConnected: false, pending: 0,
};
let THEMES = [], LETTERS = [...DEFAULT_LETTERS];
function loadOdai(j) {
  if (Array.isArray(j)) { if (j.length) THEMES = j; return; }
  if (j && Array.isArray(j.themes) && j.themes.length) THEMES = j.themes;
  if (j && typeof j.letters === "string" && j.letters.trim()) LETTERS = [...j.letters.replace(/\s/g, "")];
}
try { loadOdai(JSON.parse($("#odai-data").textContent)); } catch { }

function D() {
  const d = S.data || {}, st = d.state || {}, meta = d.meta || {};
  const players = d.players || {}, scores = d.scores || {};
  const r = st.round || 0;
  const submitted = (d.submitted || {})[r] || {};
  const revealed = (d.revealed || {})[r] || {};
  const req = (d.revealReq || {})[r] || {};
  const isHost = !!meta.hostUid && meta.hostUid === S.uid;
  const eligible = u => !(u === meta.hostUid && !st.hostPlays);
  const online = Object.keys(players).filter(u => players[u] && players[u].online !== false);
  return { d, st, meta, players, scores, r, submitted, revealed, req, isHost, eligible, online };
}
const nm = (x, u) => (x.players[u] && x.players[u].name) || "？？？";

function groupsOf(rev) {
  const rootOf = u => { let x = u, guard = 0; while (rev[x] && rev[x].sameAs && rev[rev[x].sameAs] && guard++ < 20) x = rev[x].sameAs; return x; };
  const map = {};
  const entries = Object.keys(rev).sort((a, b) => (rev[a].at || 0) - (rev[b].at || 0));
  for (const u of entries) {
    const root = rootOf(u);
    if (!map[root]) map[root] = { root, text: rev[root].text, at: rev[root].at || 0, members: [] };
    if (u === root) map[root].members.unshift(u); else map[root].members.push(u);
  }
  return Object.values(map).sort((a, b) => a.at - b.at);
}
function ranking(x) {
  return Object.keys(x.players).map(u => ({ uid: u, name: nm(x, u), score: x.scores[u] || 0 }))
    .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, "ja"));
}
function rankWithPlace(list) { let place = 0, prev = null; return list.map((p, i) => { if (p.score !== prev) { place = i + 1; prev = p.score; } return { ...p, place }; }); }

/* =====================================================================
   Weak-network handling
   Writes are applied locally at once and queued by the SDK until the
   connection returns; we only count what is still waiting and tell the person.
   ===================================================================== */
function trackWrites(db) {
  const wrap = fn => (...a) => {
    S.pending++; netBanner();
    const p = Promise.resolve(fn(...a));
    p.catch(e => console.warn(e)).finally(() => { S.pending = Math.max(0, S.pending - 1); netBanner(); render(); });
    return p;
  };
  return { ...db, set: wrap(db.set.bind(db)), update: wrap(db.update.bind(db)) };
}
let offTimer = null;
function setOnline(on) {
  clearTimeout(offTimer);
  if (on) {
    const was = S.online; S.online = true;
    if (!was && S.everConnected) netBanner("back");
    S.everConnected = true; netBanner(); render();
  } else {
    // brief drops are normal; only complain after 2.5s
    offTimer = setTimeout(() => { S.online = false; netBanner(); render(); }, 2500);
  }
}
function netBanner(kind) {
  const el = $("#net"); if (!el) return;
  clearTimeout(el._t);
  if (kind === "back") {
    el.className = "net ok show"; el.innerHTML = "✓ 電波が戻りました";
    el._t = setTimeout(() => el.classList.remove("show"), 1800); return;
  }
  if (!S.online) {
    el.className = "net show";
    el.innerHTML = `<i></i>電波を探しています…${S.pending ? `（送信待ち ${S.pending}件）` : ""}`;
  } else if (!el.classList.contains("ok")) el.classList.remove("show");
}

/* =====================================================================
   Boot
   ===================================================================== */
async function boot() {
  const useFirebase = FIREBASE_CONFIG.apiKey && !new URLSearchParams(location.search).has("demo");
  S.screen = null;
  if (location.protocol.startsWith("http") && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
  $("#app").innerHTML = `<div class="center-msg"><div class="thinking"><i></i><i></i><i></i></div><span id="boot-msg">接続中…</span></div>`;
  const slow = setTimeout(() => { const m = $("#boot-msg"); if (m) m.innerHTML = "電波が弱いようです…<br>このまま待つか、電波の入る場所へ移動してください"; }, 8000);
  try {
    S.db = trackWrites(useFirebase ? await FirebaseDB(FIREBASE_CONFIG) : LocalDB());
  } catch (e) {
    console.error(e); clearTimeout(slow);
    $("#app").innerHTML = `<div class="center-msg"><div style="font-size:44px">📶</div>サーバーに接続できませんでした。<br>電波の入る場所で再読み込みしてください。<button class="btn" onclick="location.reload()">再読み込み</button></div>`;
    return;
  }
  clearTimeout(slow);
  S.uid = S.db.uid;
  S.db.onConnection(setOnline);
  if (location.protocol.startsWith("http")) {
    fetch("questions.json").then(r => r.ok ? r.json() : null).then(j => { if (j) { loadOdai(j); render(); } }).catch(() => { });
  }
  const code = (new URLSearchParams(location.search).get("r") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
  if (code) enterRoom(code); else render();
  setInterval(tick, 250);
}

function enterRoom(code) {
  S.room = code; S.loaded = false; S.data = null; S.presenceSet = false;
  const u = new URL(location.href); u.searchParams.set("r", code); history.replaceState(null, "", u);
  if (S.unsubRoom) S.unsubRoom();
  S.unsubRoom = S.db.on(`rooms/${code}`, v => { S.data = v; S.loaded = true; onData(); });
  render();
}
function leaveRoom() {
  if (S.unsubRoom) S.unsubRoom(); if (S.unsubSecret) S.unsubSecret();
  if (S.room && S.data && S.data.players && S.data.players[S.uid]) S.db.set(`rooms/${S.room}/players/${S.uid}/online`, false);
  S.room = null; S.data = null; S.unsubRoom = null; S.unsubSecret = null; S.secretRound = null;
  const u = new URL(location.href); u.searchParams.delete("r"); history.replaceState(null, "", u);
  closeModal(); render();
}
function joinURL() { const u = new URL(location.href); u.search = ""; u.hash = ""; u.searchParams.set("r", S.room); if (S.db.mode === "demo") u.searchParams.set("demo", "1"); return u.toString(); }

function onData() {
  const x = D();
  if (S.autoJoin) {
    S.autoJoin = false;
    if (S.data && S.data.meta && !x.players[S.uid] && S.name) {
      S.db.set(`rooms/${S.room}/players/${S.uid}`, { name: S.name, joinedAt: S.db.now(), online: true });
      return;
    }
  }
  if (x.players[S.uid] && !S.presenceSet) { S.presenceSet = true; S.db.presence(`rooms/${S.room}/players/${S.uid}/online`); }
  // subscribe own secret for the current round
  if (x.players[S.uid] && x.r && S.secretRound !== x.r) {
    if (S.unsubSecret) S.unsubSecret();
    S.secretRound = x.r; const rr = x.r;
    S.unsubSecret = S.db.on(`secrets/${S.room}/${rr}/${S.uid}`, v => { if (S.secretRound === rr) { S.mine = { round: rr, text: v || "" }; render(); } });
  }
  detectReveals(x);
  hostAutomation(x);
  participantAutomation(x);
  render();
}

/* reveal flashes & sounds */
function detectReveals(x) {
  const ph = x.st.phase;
  if (S.seen.round !== x.r) { S.seen = { round: x.r, keys: new Set(Object.keys(x.revealed)), counts: {}, init: true }; groupsOf(x.revealed).forEach(g => S.seen.counts[g.root] = g.members.length); return; }
  if (ph !== "reveal") { Object.keys(x.revealed).forEach(k => S.seen.keys.add(k)); return; }
  const fresh = Object.keys(x.revealed).filter(k => !S.seen.keys.has(k)).sort((a, b) => (x.revealed[a].at || 0) - (x.revealed[b].at || 0));
  for (const k of fresh) {
    S.seen.keys.add(k);
    const e = x.revealed[k];
    if (e.sameAs && x.revealed[e.sameAs]) {
      const g = groupsOf(x.revealed).find(g => g.members.includes(k));
      S.bump = g ? g.root : null; SFX.same();
      toast(`${nm(x, k)}さん「同じ！」→ ${g ? g.text : ""}`);
    } else {
      SFX.pop(); flash(`${nm(x, k)}さんの回答`, e.text);
      S.newCard = k;
    }
  }
}
function flash(who, text) {
  const f = $("#flash");
  f.innerHTML = `<div class="who">${esc(who)}</div><div class="flip"><span class="ft">${esc(text)}</span></div>`;
  f.classList.add("show"); clearTimeout(f._t); f._t = setTimeout(() => f.classList.remove("show"), 1700);
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2200); }

/* host-only automatic transitions */
function hostAutomation(x) {
  if (!x.isHost || S.advancing) return;
  if (x.st.phase === "answering") {
    const now = S.db.now();
    const elig = x.online.filter(x.eligible);
    const allSub = elig.length > 0 && elig.every(u => x.submitted[u]);
    if (allSub) { if (!S.allSubSince) S.allSubSince = now; } else S.allSubSince = null;
    if (now >= (x.st.deadline || 0) + 1500 || (S.allSubSince && now - S.allSubSince > 1200)) {
      S.advancing = true; S.allSubSince = null;
      S.db.update(`rooms/${S.room}/state`, { phase: "reveal", revealAt: now }).finally(() => S.advancing = false);
    }
  }
}
/* participant: answer when nominated, auto-submit at time up */
function participantAutomation(x) {
  if (x.st.phase === "reveal" && x.req[S.uid] && x.submitted[S.uid] && !x.revealed[S.uid] && S.mine.round === x.r && S.mine.text && !S.autoRevealing) {
    S.autoRevealing = true;
    S.db.set(`rooms/${S.room}/revealed/${x.r}/${S.uid}`, { text: S.mine.text, at: S.db.now() }).finally(() => S.autoRevealing = false);
  }
}

function tick() {
  if (!S.data) return;
  const x = D();
  if (x.st.phase === "answering") {
    const left = Math.max(0, (x.st.deadline || 0) - S.db.now());
    const sec = Math.ceil(left / 1000);
    const tm = $(".timer");
    if (tm) {
      $(".js-sec").textContent = left > 0 ? sec : "終了";
      const dur = (x.st.duration || 60) * 1000;
      $(".timer .bar i").style.transform = `scaleX(${Math.min(1, left / dur)})`;
      tm.classList.toggle("hurry", left > 0 && sec <= 5);
      tm.classList.toggle("over", left <= 0);
    }
    if (left > 0 && sec <= 5 && S.lastTick !== sec) { S.lastTick = sec; SFX.tick(); }
    // time up: auto-submit draft
    if (left <= 0 && x.eligible(S.uid) && x.players[S.uid] && !x.submitted[S.uid] && S.ui.draft.trim() && !S.ui.autoSubmitted) {
      S.ui.autoSubmitted = true; submitAnswer(true);
    }
    hostAutomation(x);
  }
}

/* ---------- answering ---------- */
function updateAnswering(x) {
  const elig = Object.keys(x.players).filter(u => x.eligible(u) && (x.players[u].online !== false || x.submitted[u]));
  const n = elig.filter(u => x.submitted[u]).length;
  $("#pg-n").textContent = `${n} / ${elig.length}`;
  $("#pg-dots").innerHTML = elig.map(u => `<span class="${x.submitted[u] ? "y" : ""}">${x.submitted[u] ? "✓ " : ""}${esc(nm(x, u))}</span>`).join("");
  if (!x.eligible(S.uid)) return;
  const sub = !!x.submitted[S.uid];
  const over = S.db.now() >= (x.st.deadline || 0);
  const showInput = (!sub || S.ui.editing) && !over;
  $("#a-input").hidden = !showInput;

  const up = { "state/phase": "result", "state/result": result, "state/lastResult": { text: result.text, members: result.members }, [`history/${x.r}`]: { odai: x.st.odai, text: result.text, members: result.members } };
  if (g) for (const u of g.members) up[`scores/${u}`] = (x.scores[u] || 0) + 1;
  await S.db.update(`rooms/${S.room}`, up);
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el); }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.isComposing) return;
  if (e.target.id === "code" || (e.target.id === "nm" && S.screen === "home")) { e.preventDefault(); ACT[(e.target.id === "code") ? "join-code" : "create"](); }
  else if (e.target.id === "nm") { e.preventDefault(); ACT["join-room"](); }
});
document.addEventListener("input", e => { if (e.target.id === "p-custom") S.ui.custom = e.target.value; });
document.addEventListener("change", e => { if (e.target.id === "dur-in") ACT.dur(); });

/* ---------- modals ---------- */
function openModal(html) {
  $("#modal-root").innerHTML = `<div class="ovl" data-ovl><div class="modal">${html}</div></div>`;
  $("#modal-root .ovl").addEventListener("click", e => { if (e.target.hasAttribute("data-ovl")) closeModal(); });
}
function closeModal() { $("#modal-root").innerHTML = ""; S.ui.modal = null; }
let qrLib = null;
async function qrSVG(text) {
  try {
    if (!window.qrcode) { if (!qrLib) qrLib = loadScript("https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"); await qrLib; }
    const q = qrcode(0, "M"); q.addData(text); q.make();
    return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  } catch { return `<div style="color:#333;font-size:12px;text-align:center">QRを表示できません<br>URLを共有してください</div>`; }
}
async function openInvite() {
  const x = D(); const url = joinURL();
  const list = Object.keys(x.players).sort((a, b) => (x.players[a].joinedAt || 0) - (x.players[b].joinedAt || 0));
  openModal(`<h3>スマホで読み取って参加</h3>
    <div class="qr" id="qr"><div class="thinking"><i></i><i></i><i></i></div></div>
    <div class="bigcode">${esc(S.room)}</div>
    <div class="url">${esc(url)}</div>
    <div class="row"><button class="btn small" data-act="copy-url">🔗 URLをコピー</button>${S.db.mode === "demo" ? `<button class="btn small" data-act="open-tab">＋ 新しいタブで参加</button>` : ""}</div>
    <div class="scroll" style="max-height:24dvh">${list.map(u => `<div class="plist"><span class="st ${x.players[u].online === false ? "off" : ""}"></span><span class="n">${esc(nm(x, u))}${u === x.meta.hostUid ? '<span class="tag">主催者</span>' : ""}${u === S.uid ? "（あなた）" : ""}</span>${x.isHost && u !== S.uid ? `<button data-act="kick" data-u="${esc(u)}">退出させる</button>` : ""}</div>`).join("")}</div>
    <div class="row"><button class="btn small ghost" data-act="leave-room">部屋を出る</button><button class="btn small" data-act="close-modal">閉じる</button></div>`);
  const svg = await qrSVG(url); const q = $("#qr"); if (q) q.innerHTML = svg;
}
function openRank() {
  const x = D(); const list = rankWithPlace(ranking(x));
  openModal(`<h3>🏆 ランキング</h3><div class="note">正解に選ばれた回数</div>
    <div class="scroll">${list.map(p => `<div class="rk ${p.uid === S.uid ? "me" : ""}"><span class="n">${p.place}</span><span class="nm">${esc(p.name)}</span><span class="sc">${p.score}</span></div>`).join("")}</div>
    <button class="btn" data-act="close-modal">閉じる</button>`);
}

boot();
</script>
</body>
